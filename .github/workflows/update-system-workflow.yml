name: Update System Workflow Documentation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Default GITHUB_TOKEN is read-only. contents:write is required to push
# generated docs; pull-requests:write is required to comment on PRs.
permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: none

    - name: Install Composer dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction

    - name: Generate System Workflow Documentation
      run: php artisan system:generate-workflow

    - name: Check for documentation changes
      id: check-changes
      run: |
        if [ -n "$(git status --porcelain docs/system-workflow/)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: github.event_name == 'push' && steps.check-changes.outputs.changes == 'true'
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/system-workflow/
        git commit -m "docs: auto-update system workflow documentation [skip ci]"
        git push

    - name: Comment on PR
      if: github.event_name == 'pull_request' && steps.check-changes.outputs.changes == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '📄 System workflow documentation would change based on this PR. It will be auto-updated when this branch is merged.'
          })
